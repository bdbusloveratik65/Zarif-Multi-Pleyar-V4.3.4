<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZARIF Multi Player - সাময়িক বন্ধ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: #000;
      color: #0f0;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    canvas#matrix {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 900px;
      margin: 40px auto;
      padding: 40px 25px;
      background: rgba(0, 15, 0, 0.65);
      border: 1px solid #0f03;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0,255,0,0.15), inset 0 0 30px rgba(0,255,0,0.08);
      backdrop-filter: blur(5px);
      text-align: center;
      animation: glitch 4s infinite alternate;
    }

    @keyframes glitch {
      0%   { transform: translate(0); }
      20%  { transform: translate(-2px, 2px); }
      40%  { transform: translate(2px, -2px); }
      60%  { transform: translate(-1px, 1px); }
      80%  { transform: translate(1px, -1px); }
      100% { transform: translate(0); }
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #0f0;
      text-shadow: 0 0 15px #0f0, 0 0 30px #0f0;
      letter-spacing: 4px;
    }

    .status {
      font-size: 1.5rem;
      margin: 1.5rem 0 2rem;
      color: #0c3;
      text-shadow: 0 0 12px #0f0;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 2rem 0;
    }

    .btn {
      padding: 14px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.35s;
      text-decoration: none;
      box-shadow: 0 0 20px rgba(0,255,0,0.25);
      display: inline-block;
    }

    .btn-fb {
      background: linear-gradient(145deg, #0a0, #0f0);
      color: #000;
    }

    .btn-whatsapp {
      background: #25D366;
      color: white;
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 0 40px rgba(0,255,0,0.5);
    }

    .number {
      font-size: 1.5rem;
      color: #0f0;
      margin-top: 15px;
      display: none;
      text-shadow: 0 0 10px #0f0;
    }

    .footer-note {
      margin-top: 2rem;
      font-size: 1rem;
      color: #080;
      opacity: 0.85;
    }

    /* Ad Section Styling */
    .ad-container {
      margin-top: 30px;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .container { margin: 20px 10px; padding: 25px 15px; }
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>
  <div class="overlay"></div>

  <div class="container">
    <h1>ZARIF MULTI PLAYER</h1>
    <p class="status">সাময়িক ভাবে বন্ধ করা হয়েছে,ওয়েব ডেভেলপারের কিছু সমস্যার কারনে বন্ধ করা হয়েছে </p>

    <div class="buttons">
      <a href="https://www.facebook.com/share/1by8jEoBzC/" target="_blank" class="btn btn-fb">
        ফেসবুক 
      </a>

      <div>
        <button id="showNumber" class="btn btn-whatsapp">
          WhatsApp
        </button>
        <div id="phoneNumber" class="number">+880 1827 404265</div>
      </div>
    </div>

    <p class="footer-note">সিস্টেম রিকভারি চলছে... দ্রুত ফিরে আসছি।</p>

    <div class="ad-container">
      <script type="text/javascript">
        atOptions = {
          'key' : 'dc6b39ff12039e760979bb0caa89573f',
          'format' : 'iframe',
          'height' : 250,
          'width' : 300,
          'params' : {}
        };
      </script>
      <script type="text/javascript" src="https://www.highperformanceformat.com/dc6b39ff12039e760979bb0caa89573f/invoke.js"></script>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    let width, height;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const chars = "01abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*()_+-=[]{}|;:,.<>?/\~`০১২৩৪৫৬৭৮৯";
    const fontSize = 16;
    const columns = Math.floor(width / fontSize);
    const drops = new Array(columns).fill(1);

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
      ctx.fillRect(0, 0, width, height);

      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillStyle = '#0f0';
        if (Math.random() > 0.97) ctx.fillStyle = '#fff';

        ctx.fillText(text, x, y);

        if (y > height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(draw, 38);

    document.getElementById('showNumber').onclick = function() {
      document.getElementById('phoneNumber').style.display = 'block';
      this.textContent = 'নাম্বার দেখানো হয়েছে ✓';
      this.style.opacity = '0.7';
      this.disabled = true;
    };
  </script>

</body>
</html>
